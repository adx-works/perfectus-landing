services:

  traefik:
    image: traefik:v3.7.16
    restart: always
    command:
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --certificatesresolvers.letsEncrypt.acme.email=team@shamps.dev
      - --certificatesresolvers.letsEncrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsEncrypt.acme.httpchallenge.entrypoint=http
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock

  perfectus:
    image: cr.adxlabs.ru/perfectus-landing:latest
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.perfectus.rule=Host(`xn--e1aaprgigif.xn--p1ai`)
      - traefik.http.routers.perfectus.entrypoints=https
      - traefik.http.routers.perfectus.tls.certresolver=letsEncrypt
      - traefik.http.routers.perfectus.service=perfectus
      - traefik.http.routers.perfectus-www.rule=Host(`www.xn--e1aaprgigif.xn--p1ai`)
      - traefik.http.routers.perfectus-www.entrypoints=https
      - traefik.http.routers.perfectus-www.tls.certresolver=letsEncrypt
      - traefik.http.routers.perfectus-www.middlewares=perfectus-www-redirect
      - traefik.http.routers.perfectus-www.service=perfectus
      - traefik.http.middlewares.perfectus-www-redirect.redirectregex.regex=^https://www\.(.*)
      - traefik.http.middlewares.perfectus-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.perfectus-www-redirect.redirectregex.permanent=true
      - traefik.http.services.perfectus.loadbalancer.server.port=3000

volumes:
  letsencrypt: